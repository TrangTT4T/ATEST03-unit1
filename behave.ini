[behave]
paths = tests
show_skipped = false
# One run = every report (Day 3): console, HTML for people, JSON for tools; JUnit XML below.
format = pretty
    html
    json.pretty
outfiles = -
    reports/report.html
    reports/results.json
junit = true
junit_directory = reports/junit

[behave.userdata]
base_url = https://sauce-demo.myshopify.com
browser = chrome
headless = true
timeout = 10

[behave.formatters]
html = behave_html_formatter:HTMLFormatter
